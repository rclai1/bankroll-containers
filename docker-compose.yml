services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      CONNECTION: ${CONNECTION:?Set CONNECTION in the root .env file}
      PORT: "8000"
      FRONTEND_ORIGINS: http://localhost:3000
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://backend:8000
    environment:
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    depends_on:
      - backend
    ports:
      - "3000:3000"
